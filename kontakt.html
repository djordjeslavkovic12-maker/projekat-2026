<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <title>Kontakt</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

  <!-- Navigacija -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Turizam Srbija</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="beograd.html">Beograd</a></li>
          <li class="nav-item"><a class="nav-link" href="novisad.html">Novi Sad</a></li>
          <li class="nav-item"><a class="nav-link" href="nis.html">Niš</a></li>
          <li class="nav-item"><a class="nav-link" href="tara.html">Tara</a></li>
          <li class="nav-item"><a class="nav-link" href="zlatibor.html">Zlatibor</a></li>
          <li class="nav-item"><a class="nav-link" href="kopaonik.html">Kopaonik</a></li>
          <li class="nav-item"><a class="nav-link" href="banja.html">Vrnjačka Banja</a></li>
          <li class="nav-item"><a class="nav-link" href="galerija.html">Galerija</a></li>
          <li class="nav-item"><a class="nav-link active" href="kontakt.html">Kontakt</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Glavni sadržaj -->
  <main class="container mt-5 pt-5">
    <h1 class="naslov">Kontaktirajte nas</h1>
    <p>Imate pitanje ili želite da saznate više o turizmu u Srbiji? Pošaljite nam poruku!</p>

    <form id="contactForm" class="mt-4">
      <div class="mb-3">
        <label for="name" class="form-label">Ime i prezime</label>
        <input type="text" class="form-control" id="name" placeholder="Unesite vaše ime" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email adresa</label>
        <input type="email" class="form-control" id="email" placeholder="Unesite vaš email" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Poruka</label>
        <textarea class="form-control" id="message" rows="4" placeholder="Vaša poruka..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Pošalji</button>
    </form>
  </main>

  <!-- Podnožje -->
  <footer class="footer bg-dark text-white text-center">
    <p>Kontakt: turizam@srbija.rs</p>
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
